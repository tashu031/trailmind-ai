# Render.com deployment configuration for TrailMind AI
# https://render.com/docs/render-yaml-spec

services:
  # ─── Backend API (Web Service) ─────────────────────────────────────────────
  - type: web
    name: trailmind-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: OLLAMA_BASE_URL
        # NOTE: On Render, Ollama is NOT available. Backend serves the Offline Rule Engine
        # and optionally the Cloud AI provider if configured.
        value: http://localhost:11434
      - key: GEMMA_MODEL
        value: gemma2:2b
      - key: AI_TIMEOUT_SECONDS
        value: "30.0"
      - key: CLOUD_AI_PROVIDER
        value: none
      - key: MONGODB_URI
        sync: false   # Set in Render dashboard from MongoDB Atlas connection string
      - key: MONGODB_DB_NAME
        value: trailmind_db
      - key: SENTRY_DSN
        sync: false   # Set in Render dashboard
      - key: ELEVENLABS_API_KEY
        sync: false   # Set in Render dashboard

  # ─── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: trailmind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
