name: TrailMind AI — CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend: Python / FastAPI / Pytest ────────────────────────────────────
  backend-tests:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        env:
          APP_ENV: test
          OLLAMA_BASE_URL: http://localhost:11434
          GEMMA_MODEL: gemma2:2b
          MONGODB_URI: ""
          SENTRY_DSN: ""
          ELEVENLABS_API_KEY: ""
          CLOUD_AI_PROVIDER: none
        run: python -m pytest tests/ -v --tb=short

  # ─── Frontend: Node / TypeScript / Vitest / Build ──────────────────────────
  frontend-build-test:
    name: Frontend Build & Tests (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend for production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: trailmind-frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─── Integration: Run both together on PRs ─────────────────────────────────
  integration-check:
    name: Integration Health Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build-test]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify backend starts and health endpoint responds
        working-directory: backend
        env:
          APP_ENV: test
          PORT: 8000
          OLLAMA_BASE_URL: http://localhost:11434
          GEMMA_MODEL: gemma2:2b
          MONGODB_URI: ""
          SENTRY_DSN: ""
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          BACKEND_PID=$!
          sleep 4
          curl -f http://localhost:8000/health || exit 1
          kill $BACKEND_PID
          echo "✅ Health endpoint verified"
